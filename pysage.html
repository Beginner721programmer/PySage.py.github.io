<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PySage — أكاديمية بايثون</title>
<meta name="description" content="PySage — أكاديمية مفتوحة لتعلّم بايثون: من الخوارزميات وهياكل البيانات الأساسية إلى هياكل البيانات المتقدّمة وتحليل البيانات مع Numpy وPandas. بدون تسجيل دخول.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e1420; --ink-soft:#161f30; --line:rgba(246,244,238,0.12);
    --amber:#e8a33d; --teal:#4fb0a5; --muted:#9aa3b8;
    --text:#e9ecf3; --text-dim:#b7bfd2;
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); scroll-behavior:smooth;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ink); color:var(--text);
    font-family:'IBM Plex Sans Arabic','Segoe UI',sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  .mono{ font-family:'JetBrains Mono', monospace; direction:ltr; unicode-bidi:isolate; }
  a{ color:inherit; }

  header{
    position:sticky; top:0; z-index:50;
    padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;
    background:rgba(14,20,32,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; }
  .brand .dot{ width:9px;height:9px;border-radius:50%; background:var(--amber); box-shadow:0 0 0 4px rgba(232,163,61,0.18); }
  .brand-name{ font-family:'JetBrains Mono', monospace; direction:ltr; letter-spacing:0.5px; }
  .head-actions{ display:flex; align-items:center; gap:8px; }
  #langBtn{
    font-family:'JetBrains Mono',monospace; font-size:12.5px; direction:ltr;
    background:transparent; border:1px solid var(--line); color:var(--text-dim);
    padding:8px 12px; border-radius:7px; cursor:pointer; transition:all .2s;
  }
  #langBtn:hover{ border-color:var(--teal); color:var(--teal); }

  .notice{
    max-width:920px; margin:14px auto 0; padding:0 20px;
  }
  .notice-box{
    display:flex; gap:10px; align-items:flex-start;
    background:rgba(79,176,165,0.08); border:1px solid rgba(79,176,165,0.3);
    color:var(--text-dim); border-radius:9px; padding:12px 14px; font-size:13.5px;
  }
  .notice-box .ic{ color:var(--teal); font-family:'JetBrains Mono',monospace; flex:0 0 auto; }

  .hero{ padding:44px 20px 34px; max-width:920px; margin:0 auto; }
  .prompt-line{
    font-family:'JetBrains Mono', monospace; direction:ltr; text-align:left;
    font-size:13px; color:var(--teal); margin-bottom:16px; display:flex; gap:8px; align-items:center;
  }
  .prompt-line .caret{ display:inline-block; width:8px; height:16px; background:var(--teal); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  h1.title{
    font-family:'JetBrains Mono', monospace; font-size:clamp(32px,9vw,54px); line-height:1.05;
    margin:0 0 16px; font-weight:800; direction:ltr; text-align:left; letter-spacing:-1px;
  }
  h1.title span{ color:var(--amber); }
  .lede{ font-size:16.5px; color:var(--text-dim); max-width:60ch; margin:0 0 24px; }
  .hero-cta{ display:flex; flex-wrap:wrap; gap:12px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:13px 22px; border-radius:8px;
    font-weight:600; font-size:15px; text-decoration:none; border:1px solid transparent;
    cursor:pointer; transition:transform .15s ease, background .2s ease, border-color .2s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--amber); color:#1a1206; }
  .btn-primary:hover{ background:#f0b25a; }
  .btn-ghost{ background:transparent; color:var(--text); border-color:var(--line); }
  .btn-ghost:hover{ border-color:var(--teal); color:var(--teal); }

  .hero-stats{ margin-top:36px; display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--line); padding-top:20px; }
  .hero-stats div{ border-inline-start:1px solid var(--line); padding-inline-start:14px; }
  .hero-stats div:first-child{ border-inline-start:none; padding-inline-start:0; }
  .stat-num{ font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--teal); direction:ltr; }
  .stat-label{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  section{ max-width:920px; margin:0 auto; padding:50px 20px; }
  .section-head{ margin-bottom:24px; }
  .section-kicker{ font-family:'JetBrains Mono',monospace; direction:ltr; text-align:left; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .section-title{ font-size:clamp(22px,5vw,30px); font-weight:700; margin:0; color:var(--text); }
  .section-sub{ color:var(--text-dim); margin-top:8px; max-width:64ch; font-size:14.5px; }

  .tree{ background:var(--ink-soft); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .tree-titlebar{
    display:flex; align-items:center; gap:8px; padding:11px 16px; border-bottom:1px solid var(--line);
    font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); direction:ltr; text-align:left;
  }
  .tf{ width:10px;height:10px;border-radius:50%; }
  .tf.r{ background:#e0645b; } .tf.y{ background:#e8b24d; } .tf.g{ background:#59c179; }

  .chapter{ border-bottom:1px solid var(--line); }
  .chapter:last-child{ border-bottom:none; }
  .chapter-head{ display:flex; align-items:flex-start; gap:12px; padding:16px 18px; cursor:pointer; user-select:none; transition:background .15s; }
  .chapter-head:hover{ background:rgba(255,255,255,0.03); }
  .chapter-idx{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--amber); width:30px; flex:0 0 auto; direction:ltr; text-align:center; padding-top:2px;}
  .chapter-main{ flex:1; min-width:0; }
  .chapter-name{ font-weight:600; font-size:15.5px; }
  .chapter-desc{ font-size:13px; color:var(--muted); margin-top:4px; }
  .chapter-chevron{ font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:14px; transition:transform .25s ease; flex:0 0 auto; padding-top:2px;}
  .chapter.open .chapter-chevron{ transform:rotate(90deg); }
  .chapter-body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
  .chapter.open .chapter-body{ /* max-height set via JS */ }
  .lesson-list{ padding:0 18px 16px 18px; }

  .lesson{ border-top:1px dashed var(--line); }
  .lesson:first-child{ border-top:none; }
  .lesson-head{
    display:flex; align-items:center; gap:10px; padding:11px 4px 11px 46px;
    cursor:pointer; font-size:14.5px; color:var(--text-dim); transition:color .15s;
  }
  .lesson-head:hover{ color:var(--text); }
  .lesson-head .bullet{ font-family:'JetBrains Mono',monospace; color:var(--teal); font-size:13px; direction:ltr; flex:0 0 auto; }
  .lesson-head .lname{ flex:1; }
  .lesson-head .lchev{ font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:12px; transition:transform .25s ease; }
  .lesson.open .lesson-head .lchev{ transform:rotate(90deg); }
  .lesson-body{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .lesson-content{ padding:0 4px 16px 46px; font-size:14px; color:var(--text-dim); }
  .lesson-content p{ margin:0 0 10px; }
  .code-block{
    background:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-top:8px; overflow-x:auto;
  }
  .code-block pre{ margin:0; font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--teal); direction:ltr; text-align:left; white-space:pre; }

  .path{ position:relative; padding-inline-start:26px; }
  .path::before{ content:''; position:absolute; inset-inline-start:6px; top:6px; bottom:6px; width:2px; background:var(--line); }
  .path-item{ position:relative; padding-bottom:24px; }
  .path-item:last-child{ padding-bottom:0; }
  .path-item::before{ content:''; position:absolute; inset-inline-start:-26px; top:4px; width:14px; height:14px; border-radius:50%; background:var(--ink); border:2px solid var(--teal); }
  .path-item h4{ margin:0 0 4px; font-size:15px; }
  .path-item p{ margin:0; font-size:13.5px; color:var(--text-dim); }

  .cta-block{ background:var(--ink-soft); border:1px solid var(--line); border-radius:14px; padding:36px 24px; text-align:center; }
  .cta-block h2{ font-size:clamp(20px,5vw,26px); margin:0 0 10px; }
  .cta-block p{ color:var(--text-dim); margin:0 0 20px; font-size:14.5px; }

  footer{ border-top:1px solid var(--line); padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px)); text-align:center; color:var(--muted); font-size:12.5px; }

  ::selection{ background:var(--amber); color:#1a1206; }
  a:focus-visible, button:focus-visible, .chapter-head:focus-visible, .lesson-head:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; } }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <span class="brand-name">PySage<span style="color:var(--amber)">.</span>py</span>
  </div>
  <div class="head-actions">
    <button id="langBtn" onclick="toggleLang()">FR / عربي</button>
  </div>
</header>

<div class="notice">
  <div class="notice-box">
    <span class="ic mono">i</span>
    <span data-k="notice"></span>
  </div>
</div>

<section class="hero">
  <div class="prompt-line"><span class="mono">$ python3 -m pysage --start</span><span class="caret"></span></div>
  <h1 class="title">import <span>pysage</span></h1>
  <p class="lede" data-k="lede"></p>
  <div class="hero-cta">
    <a href="#courses" class="btn btn-primary" data-k="cta1"></a>
    <a href="#path" class="btn btn-ghost" data-k="cta2"></a>
  </div>
  <div class="hero-stats">
    <div><div class="stat-num">09</div><div class="stat-label" data-k="stat1"></div></div>
    <div><div class="stat-num">40+</div><div class="stat-label" data-k="stat2"></div></div>
    <div><div class="stat-num">100%</div><div class="stat-label" data-k="stat3"></div></div>
  </div>
</section>

<section id="courses">
  <div class="section-head">
    <div class="section-kicker">// pysage_academy</div>
    <h2 class="section-title" data-k="coursesTitle"></h2>
    <p class="section-sub" data-k="coursesSub"></p>
  </div>

  <div class="tree">
    <div class="tree-titlebar">
      <span class="tf r"></span><span class="tf y"></span><span class="tf g"></span>
      <span style="margin-inline-start:8px;" id="treePath">pysage_academy/</span>
    </div>
    <div id="chapterRoot"></div>
  </div>
</section>

<section id="path">
  <div class="section-head">
    <div class="section-kicker">// learning_path</div>
    <h2 class="section-title" data-k="pathTitle"></h2>
  </div>
  <div class="path" id="pathRoot"></div>
</section>

<section id="cta">
  <div class="cta-block">
    <h2 data-k="ctaTitle"></h2>
    <p data-k="ctaBody"></p>
    <a href="#courses" class="btn btn-primary" data-k="ctaBtn"></a>
  </div>
</section>

<footer>
  <span class="brand-name mono">PySage.py</span> — <span data-k="footer"></span>
</footer>

<script>

const STATIC = {

    fr: "PySage est une académie de Python, de zéro jusqu'à l'analyse de données : algorithmique, structures de données avancées, puis Numpy et Pandas. Toutes les leçons sont ici, directement, sans inscription."

const PATH_STEPS = [
  { h:{ar:"1 — بناء الأساس",fr:"1 — Construire les bases"},
    p:{ar:"إتقان أساسيات البرمجة والخوارزميات وهياكل البيانات القياسية قبل أي شيء آخر.",
       fr:"Maîtriser les bases de la programmation, l'algorithmique et les structures de données standards avant tout le reste."} },
  { h:{ar:"2 — التعمّق في هياكل البيانات",fr:"2 — Approfondir les structures de données"},
    p:{ar:"فهم القوائم المرتبطة، الأشجار، الرسوم البيانية، وجداول التجزئة من الداخل.",
       fr:"Comprendre les listes chaînées, les arbres, les graphes et les tables de hachage en profondeur."} },
  { h:{ar:"3 — الانتقال إلى Numpy",fr:"3 — Passer à Numpy"},

// ===== Course content =====
const COURSES = [
{ num:"01",
  t:{ar:"مقدّمة إلى الخوارزميات والبرمجة",fr:"Introduction à l'algorithmique et à la programmation"},
  d:{ar:"كيف يفكّر المبرمج قبل أن يكتب أي سطر كود",fr:"Comment un programmeur pense avant d'écrire la moindre ligne de code"},
  lessons:[
    { t:{ar:"ما هو الخوارزمية؟",fr:"Qu'est-ce qu'un algorithme ?"},
      b:{ar:"الخوارزمية هي سلسلة خطوات دقيقة ومنتهية لحل مسألة معيّنة. قبل كتابة أي كود، يجب صياغة الحل بشكل منطقي وواضح، غالبًا بالكتابة الوصفية (pseudo-code) أو بمخطّط تدفّق.",

    { t:{ar:"لماذا بايثون؟",fr:"Pourquoi Python ?"},

    { t:{ar:"التثبيت وأول برنامج",fr:"Installation et premier programme"},
      b:{ar:"بعد تثبيت بايثون، أول برنامج تقليدي هو طباعة عبارة ترحيبية على الشاشة.",fr:"Après avoir installé Python, le premier programme traditionnel consiste à afficher un message de bienvenue à l'écran."},

    { t:{ar:"لغة مفسَّرة مقابل لغة مترجَمة",fr:"Langage interprété vs compilé"},

    { t:{ar:"العوامل الحسابية والمنطقية",fr:"Opérateurs arithmétiques et logiques"},
      b:{ar:"تشمل العمليات الحسابية (+، -، *، /، //، %، **) وعمليات المقارنة (==، !=، <، >) والعمليات المنطقية (and، or، not).",

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// Remember which chapters/lessons are open so switching language doesn't collapse the user's progress.
function captureOpenState(){
  const openChapters = new Set();
  const openLessons = new Set(); // "chapterIdx:lessonIdx"
  document.querySelectorAll('.chapter').forEach(chap=>{
    if(chap.classList.contains('open')) openChapters.add(chap.dataset.idx);
    chap.querySelectorAll('.lesson').forEach(les=>{
      if(les.classList.contains('open')) openLessons.add(chap.dataset.idx + ':' + les.dataset.idx);
    });
  });
  return { openChapters, openLessons };
}

function render(prevState){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-k]').forEach(el=>{
    const key = el.getAttribute('data-k');
    if(STATIC[key]) el.textContent = STATIC[key][LANG];
  });

  const langBtn = document.getElementById('langBtn');
  langBtn.textContent = LANG === 'ar' ? 'Français' : 'العربية';
  langBtn.setAttribute('aria-label', LANG === 'ar' ? 'Switch to French' : 'التبديل إلى العربية');

  document.getElementById('treePath').textContent = LANG==='ar' ? 'اكاديمية_باي_سايج/' : 'pysage_academie/';

  const hasPrev = prevState && (prevState.openChapters.size || prevState.openLessons.size);

  const root = document.getElementById('chapterRoot');
  root.innerHTML = '';
  COURSES.forEach((c, ci)=>{
    const isOpen = hasPrev ? prevState.openChapters.has(String(ci)) : ci===0;
    const chap = document.createElement('div');
    chap.className = 'chapter' + (isOpen ? ' open':'');
    chap.dataset.idx = ci;
    chap.innerHTML = `
      <div class="chapter-head" role="button" tabindex="0" aria-expanded="${isOpen}" onclick="toggleChapter(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleChapter(this);}">
        <span class="chapter-idx mono">${c.num}</span>
        <div class="chapter-main">
          <div class="chapter-name">${escapeHtml(c.t[LANG])}</div>
          <div class="chapter-desc">${escapeHtml(c.d[LANG])}</div>
        </div>
        <span class="chapter-chevron">›</span>
      </div>
      <div class="chapter-body">
        <div class="lesson-list">
          ${c.lessons.map((l,li)=>{
            const lOpen = hasPrev && prevState.openLessons.has(ci + ':' + li);
            return `
            <div class="lesson${lOpen ? ' open':''}" data-idx="${li}">
              <div class="lesson-head" role="button" tabindex="0" aria-expanded="${lOpen}" onclick="toggleLesson(event,this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleLesson(event,this);}">
                <span class="bullet">-</span>
                <span class="lname">${escapeHtml(l.t[LANG])}</span>
                <span class="lchev">›</span>
              </div>
              <div class="lesson-body">
                <div class="lesson-content">
                  <p>${escapeHtml(l.b[LANG])}</p>
                  ${l.code ? `<div class="code-block"><pre>${escapeHtml(l.code)}</pre></div>` : ''}
                </div>
              </div>
            </div>
          `;}).join('')}
        </div>
      </div>
    `;
    root.appendChild(chap);
  });

  // Set initial heights for anything restored/defaulted to open (innermost first, so parents measure correctly).
  root.querySelectorAll('.lesson.open .lesson-body').forEach(b=>{
    b.style.maxHeight = b.scrollHeight + 'px';
  });
  root.querySelectorAll('.chapter.open .chapter-body').forEach(b=>{
    b.style.maxHeight = b.scrollHeight + 'px';
  });

  const pathRoot = document.getElementById('pathRoot');
  pathRoot.innerHTML = PATH_STEPS.map(s=>`
    <div class="path-item">
      <h4>${escapeHtml(s.h[LANG])}</h4>
      <p>${escapeHtml(s.p[LANG])}</p>
    </div>
  `).join('');
}

function syncChapterHeight(chap){
  const body = chap.querySelector('.chapter-body');
  if(chap.classList.contains('open')){
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

function toggleChapter(headEl){
  const chap = headEl.parentElement;
  const body = chap.querySelector('.chapter-body');
  const wasOpen = chap.classList.contains('open');
  chap.classList.toggle('open');
  headEl.setAttribute('aria-expanded', String(!wasOpen));
  body.style.maxHeight = wasOpen ? '0px' : body.scrollHeight + 'px';
}

function toggleLesson(evt, headEl){
  evt.stopPropagation();
  const lesson = headEl.parentElement;
  const body = lesson.querySelector('.lesson-body');
  const wasOpen = lesson.classList.contains('open');
  lesson.classList.toggle('open');
  headEl.setAttribute('aria-expanded', String(!wasOpen));
  body.style.maxHeight = wasOpen ? '0px' : body.scrollHeight + 'px';

  // Keep the parent chapter tall enough to show the lesson as it opens/closes.
  const chap = lesson.closest('.chapter');
  syncChapterHeight(chap);
  body.addEventListener('transitionend', ()=> syncChapterHeight(chap), { once:true });
}

function toggleLang(){
  const prevState = captureOpenState();
  LANG = LANG === 'ar' ? 'fr' : 'ar';
  render(prevState);
}

render();
</script>
</body>
</html>
